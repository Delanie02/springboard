<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Giphy Party</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="meme-form">
          <h1>Meme generator</h1>
          <form id="giphy-form">
            <label for="search-text"
              >Type a word or phrase to turn into a meme:</label
            >
            <br />
            <div class="input-group" id="input-group" required>
              <input
                type="text"
                ,
                id="search-text"
                ,
                name="search-text"
                class="input"
              />
            </div>
            <div class="error-message" id="error-message"></div>
            <br />
            <input type="submit" , id="submit-search" , value="Meme-ify" />
            <br />
            <button type="button" id="remove-all" class="remove-all">
              Remove All
            </button>
          </form>
        </div>
        <div id="gif-results" class="gif-results"></div>
      </section>
    </main>
    <!-- Axios is already imported here for your convenience -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
